archs=arm64-v8a,x86_64,armeabi-v7a
org.gradle.jvmargs=-Djdk.lang.Process.launchMechanism=vfork
android.useAndroidX=true
android.enableJetifier=false
android.native.buildOutput=verbose
kotlin.code.style=official
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=true
# newDsl MUST stay false: the protobuf-gradle-plugin casts the Android extension to the
# legacy BaseExtension, which only exists under the old DSL (new DSL -> GroovyCastException).
android.newDsl=false
# Mute the AGP-9 experimental-option warnings, including this option warning about itself.
android.suppressUnsupportedOptionWarnings=android.builtInKotlin,android.newDsl,android.suppressUnsupportedOptionWarnings
